name: Desktop companion

# Builds the ready-to-run Windows companion so users never have to install
# Node, open a terminal, or build the installer themselves. Deliberately not
# on every push — it only runs when a desktop version is tagged, or on demand.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release from this run (creates the desktop-v<version> tag from package.json if it doesn't exist yet)"
        type: boolean
        default: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund

      # artifactName embeds ${version} from package.json, which is pinned. Left
      # alone, every tag would ship a file called VetroAI-Setup-1.0.0.exe and
      # the installed app would report 1.0.0 forever, so there'd be no way to
      # tell two releases apart.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: npm --prefix desktop version "${GITHUB_REF_NAME#desktop-v}" --no-git-tag-version --allow-same-version

      # --publish never: this workflow decides what gets released below, rather
      # than electron-builder pushing on its own the moment it sees a token.
      # Runs the package.json script so CI and a local build can't drift apart.
      - name: Build installer and portable build
        run: npm --prefix desktop run dist:win -- --publish never

      # Available on every run, tagged or not, so a build can be tested before
      # it's ever released.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vetroai-desktop-windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error

      # Two ways in here: an actual "desktop-v*" tag push (the tag already
      # exists, so --verify-tag catches a typo'd ref instead of silently
      # tagging the wrong commit), or a manual dispatch with "publish" checked
      # (no tag exists yet — gh creates "desktop-v<package.json version>"
      # pointing at whatever commit this run checked out).
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event.inputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/desktop-v') }}" == "true" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERIFY_FLAG="--verify-tag"
          else
            TAG="desktop-v$(node -p "require('./desktop/package.json').version")"
            VERIFY_FLAG=""
          fi
          gh release create "$TAG" \
            --title "VetroAI Desktop ${TAG#desktop-}" \
            --notes "Download **VetroAI-Setup-*.exe** and run it. No Node.js, no terminal, no admin rights needed. Open VetroAI, go to Computer mode, and click Allow when it asks for screen control." \
            $VERIFY_FLAG \
            desktop/dist/*.exe
