name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys of main overlap.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Backend tests
        run: npm --prefix backend test

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # Frontend deploys are handled by Cloudflare's own Git integration (it
  # watches this repo directly and builds/publishes on push to main), not by
  # this workflow. A previous "Deploy frontend (Cloudflare)" job here required
  # a CLOUDFLARE_API_TOKEN secret that was never configured, so every run of
  # it silently skipped the actual deploy steps while still reporting
  # "success" — misleading anyone checking CI status. Removed rather than
  # fixed, since running two independent deploy paths for the same site would
  # just race each other.

  deploy-backend:
    name: Deploy backend (Render)
    runs-on: ubuntu-latest
    needs: test
    steps:
      # Render builds from its own copy of the repo; this just tells it to start.
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set — skipping the backend deploy. Render can also auto-deploy on push from its own dashboard."
            exit 0
          fi
          status=$(curl -sS -o /tmp/render.out -w '%{http_code}' "$HOOK")
          cat /tmp/render.out
          if [ "$status" -ge 300 ]; then
            echo "::error::Render deploy hook returned HTTP $status"
            exit 1
          fi
          echo "Render deploy triggered."

  # Dispatch (users/{uid}/dispatch, /devices) and Publish (sites/) only work
  # once firestore.rules is live. Deploys it whenever main changes, using a
  # service account key saved as the FIREBASE_SERVICE_ACCOUNT secret (the
  # JSON from Firebase console → Project settings → Service accounts, with the
  # "Firebase Rules Admin" role). Skips with a notice until that is set.
  deploy-firestore-rules:
    name: Deploy Firestore rules
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy firestore.rules
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set — skipping the Firestore rules deploy. Deploy them by hand: npx firebase-tools deploy --only firestore:rules --project vetroai"
            exit 0
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only firestore:rules --project vetroai --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
