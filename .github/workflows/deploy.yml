name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys of main overlap.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm --prefix backend ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Backend tests
        run: npm --prefix backend test

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy-frontend:
    name: Deploy frontend (Cloudflare)
    runs-on: ubuntu-latest
    # Nothing ships unless the tests passed.
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the frontend deploy. Add it in Settings → Secrets and variables → Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend dependencies
        if: steps.creds.outputs.configured == 'true'
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Build frontend
        if: steps.creds.outputs.configured == 'true'
        run: npm --prefix frontend run build

      # wrangler.jsonc already declares the build command and the assets
      # directory, so this only needs to publish what was just built.
      - name: Deploy to Cloudflare
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-backend:
    name: Deploy backend (Render)
    runs-on: ubuntu-latest
    needs: test
    steps:
      # Render builds from its own copy of the repo; this just tells it to start.
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set — skipping the backend deploy. Render can also auto-deploy on push from its own dashboard."
            exit 0
          fi
          status=$(curl -sS -o /tmp/render.out -w '%{http_code}' "$HOOK")
          cat /tmp/render.out
          if [ "$status" -ge 300 ]; then
            echo "::error::Render deploy hook returned HTTP $status"
            exit 1
          fi
          echo "Render deploy triggered."
