<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <meta name="description" content="A to-do list saved to your Puter account, with Claude Opus 5.5 on hand for questions.">
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --ink: #1f1d1a;
      --ink-2: #57524a;
      --ink-3: #8a8378;
      --line: #e5e0d6;
      --accent: #c2571a;
      --accent-ink: #ffffff;
      --accent-soft: #fbeee5;
      --danger: #b42318;
      --ok: #2f7d4f;
      --shadow: 0 1px 2px rgba(31, 29, 26, .06), 0 8px 24px rgba(31, 29, 26, .06);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171614;
        --card: #211f1c;
        --ink: #f1ede6;
        --ink-2: #c4bdb1;
        --ink-3: #8f887d;
        --line: #35322d;
        --accent: #e8793a;
        --accent-ink: #1b1003;
        --accent-soft: #3a2618;
        --danger: #f07167;
        --ok: #6fcf97;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 16px 64px;
      /* A flex column rather than a grid: a grid column grew to its widest
         child and scrolled sideways on a phone, and it ignores the empty
         status line's negative margin below. */
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: -.01em; }
    h2 { margin: 0 0 12px; font-size: 17px; }
    .account { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 10px;
      padding: 8px 14px;
      transition: background .15s, border-color .15s;
    }
    .btn:hover:not(:disabled) { border-color: var(--ink-3); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.05); border-color: var(--accent); }
    .btn-small { padding: 4px 10px; font-size: 14px; border-radius: 8px; }
    .btn-quiet { border-color: transparent; background: transparent; color: var(--ink-3); }
    .btn-quiet:hover:not(:disabled) { color: var(--ink); border-color: var(--line); }

    /* Sign-in */
    .welcome { text-align: center; padding: 40px 20px; }
    .welcome p { color: var(--ink-2); margin: 0 auto 20px; max-width: 420px; }

    /* Add form */
    .add { display: flex; gap: 8px; }
    .add input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 12px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
      font-size: 14px;
      color: var(--ink-2);
    }
    .filters { display: flex; gap: 4px; }
    .filters button {
      border: 1px solid transparent;
      background: transparent;
      border-radius: 999px;
      padding: 4px 12px;
      color: var(--ink-2);
    }
    .filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    /* List */
    ul.todos { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--line); }
    .todo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 2px;
      border-bottom: 1px solid var(--line);
    }
    .todo input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
    .todo .text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      cursor: text;
    }
    .todo.done .text { color: var(--ink-3); text-decoration: line-through; }
    .todo .edit {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--accent);
      background: var(--bg);
      border-radius: 8px;
      padding: 4px 8px;
    }
    .todo .actions { display: flex; gap: 2px; flex: none; }
    .empty { color: var(--ink-3); text-align: center; padding: 24px 0 8px; margin: 0; }

    /* Ask Claude */
    .ask textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .ask .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .model { font-size: 13px; color: var(--ink-3); }
    .answer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      overflow-wrap: anywhere;
    }
    .answer p { margin: 0 0 10px; }
    .answer ul, .answer ol { margin: 0 0 10px; padding-left: 22px; }
    .answer h3, .answer h4 { margin: 14px 0 6px; font-size: 16px; }
    .answer code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; font-size: 14px; }
    .answer pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
    .answer pre code { border: 0; padding: 0; }
    .answer.error { color: var(--danger); }

    /* Status line */
    .status { min-height: 1.5em; font-size: 14px; color: var(--ink-3); margin: 0; }
    /* Takes no room while empty, so it doesn't double the gap under the header. */
    .status:empty { min-height: 0; margin-bottom: -20px; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }

    @media (max-width: 480px) {
      main { padding-top: 20px; }
      h1 { font-size: 24px; }
      .card { padding: 16px; }
      .todo .actions .btn-label { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>To-Do List</h1>
      <div class="account" id="account" hidden>
        <span id="username"></span>
        <button class="btn btn-small" id="sign-out" type="button">Sign out</button>
      </div>
    </header>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="card welcome" id="welcome" hidden>
      <h2>Your tasks, saved to your Puter account</h2>
      <p>Sign in with a free Puter account to keep your list. It's private to you and follows you to any device.</p>
      <button class="btn btn-primary" id="sign-in" type="button">Sign in with Puter</button>
    </section>

    <section class="card" id="app" hidden>
      <form class="add" id="add-form" autocomplete="off">
        <input id="new-todo" maxlength="500" placeholder="What needs doing?" aria-label="New task">
        <button class="btn btn-primary" type="submit">Add</button>
      </form>

      <div class="toolbar">
        <span id="remaining"></span>
        <div class="filters" role="group" aria-label="Show">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
        <button class="btn btn-small btn-quiet" id="clear-done" type="button">Clear done</button>
      </div>

      <ul class="todos" id="list"></ul>
      <p class="empty" id="empty" hidden></p>
    </section>

    <section class="card ask" id="ask" hidden>
      <h2>Ask Claude</h2>
      <form id="ask-form">
        <textarea id="prompt" aria-label="Question for Claude">Explain quantum computing in simple terms</textarea>
        <div class="row">
          <span class="model">anthropic/claude-opus-5-5</span>
          <button class="btn btn-primary" id="ask-button" type="submit">Ask</button>
        </div>
      </form>
      <div class="answer" id="answer" aria-live="polite" hidden></div>
    </section>

  </main>

  <script>
    // Each task is its own key in the user's Puter key-value store, so adding,
    // ticking or deleting one task never rewrites the others.
    const KEY_PREFIX = "todo:";
    const CLAUDE_MODEL = "anthropic/claude-opus-5-5";

    const $ = (id) => document.getElementById(id);
    const els = {
      welcome: $("welcome"), app: $("app"), ask: $("ask"), account: $("account"),
      username: $("username"), signIn: $("sign-in"), signOut: $("sign-out"),
      addForm: $("add-form"), newTodo: $("new-todo"), list: $("list"), empty: $("empty"),
      remaining: $("remaining"), clearDone: $("clear-done"), status: $("status"),
      askForm: $("ask-form"), prompt: $("prompt"), askButton: $("ask-button"), answer: $("answer"),
    };

    let todos = [];
    let filter = "all";
    let editingId = null;

    // ── Status line ─────────────────────────────────────────────────────────
    let statusTimer = null;
    function setStatus(message, kind = "") {
      clearTimeout(statusTimer);
      els.status.textContent = message;
      els.status.className = `status ${kind}`.trim();
      if (message && kind !== "error") statusTimer = setTimeout(() => setStatus(""), 2500);
    }

    // Puter rejects with plain objects as often as with Errors.
    function errorMessage(err) {
      return err?.message || err?.error?.message || (typeof err?.error === "string" ? err.error : "") || String(err || "Unknown error");
    }

    // ── Storage (puter.kv) ──────────────────────────────────────────────────
    async function loadTodos() {
      const pairs = await puter.kv.list(`${KEY_PREFIX}*`, true);
      todos = pairs
        .map((pair) => pair.value)
        .filter((todo) => todo && typeof todo.text === "string")
        .sort((a, b) => a.createdAt - b.createdAt);
    }

    // Updates the screen first, then saves. If the save fails, the list is
    // reloaded so the screen never shows something that wasn't stored.
    // Resolves to whether the save went through.
    async function persist(action, failureMessage) {
      if (els.status.classList.contains("error")) setStatus("");
      render();
      try {
        await action();
        return true;
      } catch (err) {
        setStatus(`${failureMessage}: ${errorMessage(err)}`, "error");
        try { await loadTodos(); } catch { /* keep what's on screen */ }
        render();
        return false;
      }
    }

    function newId() {
      return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    async function addTodo(text) {
      const now = Date.now();
      const todo = { id: newId(), text, done: false, createdAt: now, updatedAt: now };
      todos.push(todo);
      const saved = await persist(() => puter.kv.set(KEY_PREFIX + todo.id, todo), "Couldn't save the task");
      // Hand the text back so it can be retried rather than typed again.
      if (!saved && !els.newTodo.value) els.newTodo.value = text;
    }

    function updateTodo(id, changes) {
      const todo = todos.find((t) => t.id === id);
      if (!todo) return;
      Object.assign(todo, changes, { updatedAt: Date.now() });
      return persist(() => puter.kv.set(KEY_PREFIX + id, todo), "Couldn't update the task");
    }

    function deleteTodo(id) {
      todos = todos.filter((t) => t.id !== id);
      return persist(() => puter.kv.del(KEY_PREFIX + id), "Couldn't delete the task");
    }

    function clearDone() {
      const done = todos.filter((t) => t.done);
      if (!done.length) return;
      todos = todos.filter((t) => !t.done);
      return persist(() => Promise.all(done.map((t) => puter.kv.del(KEY_PREFIX + t.id))), "Couldn't clear done tasks");
    }

    // ── Rendering ───────────────────────────────────────────────────────────
    function render() {
      const visible = todos.filter((t) => filter === "all" || (filter === "done" ? t.done : !t.done));
      const left = todos.filter((t) => !t.done).length;

      els.list.replaceChildren(...visible.map(renderTodo));
      els.remaining.textContent = `${left} ${left === 1 ? "task" : "tasks"} left`;
      els.clearDone.disabled = !todos.some((t) => t.done);

      const emptyText = !todos.length ? "Nothing here yet. Add your first task above."
        : filter === "active" && !visible.length ? "All done. Nice work."
        : filter === "done" && !visible.length ? "No finished tasks yet."
        : "";
      els.empty.textContent = emptyText;
      els.empty.hidden = !emptyText;

      for (const button of document.querySelectorAll("[data-filter]")) {
        button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
      }
    }

    function renderTodo(todo) {
      const li = document.createElement("li");
      li.className = `todo${todo.done ? " done" : ""}`;

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = todo.done;
      checkbox.setAttribute("aria-label", `Mark "${todo.text}" as ${todo.done ? "not done" : "done"}`);
      checkbox.addEventListener("change", () => updateTodo(todo.id, { done: checkbox.checked }));
      li.append(checkbox);

      if (editingId === todo.id) {
        li.append(renderEditor(todo));
        return li;
      }

      const text = document.createElement("span");
      text.className = "text";
      text.textContent = todo.text;
      text.title = "Double-click to edit";
      text.addEventListener("dblclick", () => startEditing(todo.id));
      li.append(text);

      const actions = document.createElement("div");
      actions.className = "actions";
      actions.append(
        actionButton("Edit", `Edit "${todo.text}"`, () => startEditing(todo.id)),
        actionButton("Delete", `Delete "${todo.text}"`, () => deleteTodo(todo.id)),
      );
      li.append(actions);
      return li;
    }

    function actionButton(label, ariaLabel, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "btn btn-small btn-quiet";
      button.setAttribute("aria-label", ariaLabel);
      button.innerHTML = `<span aria-hidden="true">${label === "Edit" ? "✎" : "✕"}</span> <span class="btn-label"></span>`;
      button.querySelector(".btn-label").textContent = label;
      button.addEventListener("click", onClick);
      return button;
    }

    function renderEditor(todo) {
      const input = document.createElement("input");
      input.className = "edit";
      input.value = todo.text;
      input.maxLength = 500;
      input.setAttribute("aria-label", "Edit task");
      let finished = false;
      const finish = (save) => {
        if (finished) return;
        finished = true;
        editingId = null;
        const text = input.value.trim();
        if (save && text && text !== todo.text) updateTodo(todo.id, { text });
        else if (save && !text) deleteTodo(todo.id);
        else render();
      };
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") finish(true);
        if (event.key === "Escape") finish(false);
      });
      input.addEventListener("blur", () => finish(true));
      requestAnimationFrame(() => { input.focus(); input.select(); });
      return input;
    }

    function startEditing(id) {
      editingId = id;
      render();
    }

    // ── Ask Claude ──────────────────────────────────────────────────────────
    // Renders Claude's Markdown safely: everything is escaped first, then a
    // few common forms (headings, lists, bold, italics, code) are turned back on.
    function renderMarkdown(markdown) {
      const escape = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const inline = (s) => escape(s)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)]|$)/g, "$1<em>$2</em>");

      const html = [];
      let list = null;
      let code = null;
      const closeList = () => { if (list) { html.push(`</${list}>`); list = null; } };

      for (const line of markdown.split("\n")) {
        if (line.trim().startsWith("```")) {
          if (code === null) { closeList(); code = []; }
          else { html.push(`<pre><code>${escape(code.join("\n"))}</code></pre>`); code = null; }
          continue;
        }
        if (code !== null) { code.push(line); continue; }

        const heading = line.match(/^#{1,6}\s+(.*)/);
        const bullet = line.match(/^\s*[-*•]\s+(.*)/);
        const numbered = line.match(/^\s*\d+[.)]\s+(.*)/);
        if (bullet || numbered) {
          const type = bullet ? "ul" : "ol";
          if (list !== type) { closeList(); html.push(`<${type}>`); list = type; }
          html.push(`<li>${inline((bullet || numbered)[1])}</li>`);
        } else {
          closeList();
          if (heading) html.push(`<h3>${inline(heading[1])}</h3>`);
          else if (line.trim()) html.push(`<p>${inline(line)}</p>`);
        }
      }
      closeList();
      if (code !== null) html.push(`<pre><code>${escape(code.join("\n"))}</code></pre>`);
      return html.join("");
    }

    async function askClaude(question) {
      els.askButton.disabled = true;
      els.askButton.textContent = "Thinking…";
      els.answer.hidden = false;
      els.answer.classList.remove("error");
      els.answer.textContent = "…";

      try {
        const response = await puter.ai.chat(question, { model: CLAUDE_MODEL, stream: true });
        let text = "";
        for await (const part of response) {
          if (part?.type === "error") throw new Error(part.error?.message || "Claude returned an error.");
          if (typeof part?.text !== "string" || !part.text) continue;
          text += part.text;
          els.answer.innerHTML = renderMarkdown(text);
        }
        if (!text.trim()) throw new Error("Claude returned an empty answer. Please try again.");
      } catch (err) {
        els.answer.classList.add("error");
        els.answer.textContent = `Couldn't get an answer: ${errorMessage(err)}`;
      } finally {
        els.askButton.disabled = false;
        els.askButton.textContent = "Ask";
      }
    }

    // ── Sign-in and start-up ────────────────────────────────────────────────
    function showSignedOut() {
      todos = [];
      editingId = null;
      filter = "all";
      // The next person to sign in on this browser shouldn't see this answer.
      els.answer.hidden = true;
      els.answer.textContent = "";
      els.welcome.hidden = false;
      els.app.hidden = true;
      els.ask.hidden = true;
      els.account.hidden = true;
    }

    async function showSignedIn() {
      els.welcome.hidden = true;
      els.account.hidden = false;
      els.username.textContent = "";
      setStatus("Loading your tasks…");
      try {
        const [user] = await Promise.all([puter.auth.getUser(), loadTodos()]);
        els.username.textContent = user?.username ? `Signed in as ${user.username}` : "";
        setStatus("");
      } catch (err) {
        // A stored session Puter no longer accepts: sign in afresh.
        if (err?.status === 401) {
          puter.auth.signOut();
          showSignedOut();
          setStatus("Your Puter session has expired. Please sign in again.", "error");
          return;
        }
        setStatus(`Couldn't load your tasks: ${errorMessage(err)}`, "error");
      }
      els.app.hidden = false;
      els.ask.hidden = false;
      render();
      els.newTodo.focus();
    }

    els.signIn.addEventListener("click", async () => {
      // Opens Puter's sign-in popup, so it has to run from this click.
      els.signIn.disabled = true;
      try {
        const result = await puter.auth.signIn();
        if (result && result.success === false) throw new Error(result.error || result.msg || "Sign-in was cancelled.");
        await showSignedIn();
      } catch (err) {
        setStatus(`Sign-in didn't finish: ${errorMessage(err)}`, "error");
      } finally {
        els.signIn.disabled = false;
      }
    });

    els.signOut.addEventListener("click", () => {
      puter.auth.signOut();
      showSignedOut();
      setStatus("Signed out.", "ok");
    });

    els.addForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = els.newTodo.value.trim();
      if (!text) return;
      els.newTodo.value = "";
      if (filter === "done") filter = "all";
      addTodo(text);
    });

    for (const button of document.querySelectorAll("[data-filter]")) {
      button.addEventListener("click", () => { filter = button.dataset.filter; render(); });
    }

    els.clearDone.addEventListener("click", clearDone);

    els.askForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const question = els.prompt.value.trim();
      if (question) askClaude(question);
    });
    els.prompt.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) els.askForm.requestSubmit();
    });

    if (!window.puter) {
      setStatus("Puter.js didn't load. Check your connection and refresh the page.", "error");
    } else if (puter.auth.isSignedIn()) {
      showSignedIn();
    } else {
      showSignedOut();
    }
  </script>
</body>
</html>
